name: Compile Tilux ASM Core Extensions

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows you to trigger the compile manually with a button click

jobs:
  build-extensions:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # This tells GitHub to spin up Windows, Mac, and Linux machines!
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile 3.11
        shell: bash
        run: |
          python -m pip install --upgrade pip nuitka
          pip install -r requirements.txt || true
          for mod in brain.py sfdcr.py credentials.py actions.py firebase_sync.py usage_tracker.py executors/file_executor.py executors/media_executor.py executors/messaging_executor.py; do
            if [ -f "$mod" ]; then
              python -m nuitka --module "$mod" --enable-plugin=anti-bloat || true
            fi
          done

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile 3.12
        shell: bash
        run: |
          python -m pip install --upgrade pip nuitka
          pip install -r requirements.txt || true
          for mod in brain.py sfdcr.py credentials.py actions.py firebase_sync.py usage_tracker.py executors/file_executor.py executors/media_executor.py executors/messaging_executor.py; do
            if [ -f "$mod" ]; then
              python -m nuitka --module "$mod" --enable-plugin=anti-bloat || true
            fi
          done

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile 3.13
        shell: bash
        run: |
          python -m pip install --upgrade pip nuitka
          pip install -r requirements.txt || true
          for mod in brain.py sfdcr.py credentials.py actions.py firebase_sync.py usage_tracker.py executors/file_executor.py executors/media_executor.py executors/messaging_executor.py; do
            if [ -f "$mod" ]; then
              python -m nuitka --module "$mod" --enable-plugin=anti-bloat || true
            fi
          done

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile 3.14
        shell: bash
        run: |
          python -m pip install --upgrade pip nuitka
          pip install -r requirements.txt || true
          for mod in brain.py sfdcr.py credentials.py actions.py firebase_sync.py usage_tracker.py executors/file_executor.py executors/media_executor.py executors/messaging_executor.py; do
            if [ -f "$mod" ]; then
              python -m nuitka --module "$mod" --enable-plugin=anti-bloat || true
            fi
          done

      - name: Create Clean Engine Dist Folder
        run: |
          python -c '
          import os, shutil, glob
          dist_dir = "tilux_engine_dist"
          os.makedirs(dist_dir, exist_ok=True)
          for f in glob.glob("*.py") + ["requirements.txt", "settings.json", "user_personal.json", "README.md"]:
              if os.path.exists(f): shutil.copy2(f, dist_dir)
          for f in glob.glob("*.so") + glob.glob("*.pyd"): shutil.copy2(f, dist_dir)
          for d in ["static", "templates"]:
              if os.path.exists(d): shutil.copytree(d, os.path.join(dist_dir, d), dirs_exist_ok=True)
          os.makedirs(os.path.join(dist_dir, "executors"), exist_ok=True)
          for f in glob.glob("executors/*.py") + glob.glob("executors/*.so") + glob.glob("executors/*.pyd"): shutil.copy2(f, os.path.join(dist_dir, "executors"))
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./tilux-client

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        working-directory: ./tilux-client

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        working-directory: ./tilux-client

      - name: Install Linux Build Dependencies (bsdtar for pacman)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux
        working-directory: ./tilux-client

      - name: Upload Final Installers
        uses: actions/upload-artifact@v4
        with:
          name: Tilux-Installers-${{ matrix.os }}
          path: ./tilux-client/dist/*.*
