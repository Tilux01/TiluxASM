name: Compile Tilux ASM Core Extensions

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows you to trigger the compile manually with a button click

permissions:
  contents: write

jobs:
  build-extensions:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This tells GitHub to spin up Windows, Mac, and Linux machines!
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Extensions (Python 3.11)
        shell: bash
        run: |
          python -m pip install --upgrade pip nuitka
          pip install -r requirements.txt || true
          for mod in brain.py sfdcr.py vault.py credentials.py actions.py cloud_bridge.py usage_tracker.py reflex_router.py os_protocols.py os_protocol.py mac_permissions.py executors/file_executor.py executors/media_executor.py executors/messaging_executor.py; do
            if [ -f "$mod" ]; then
              out_dir="$(dirname "$mod")"
              python -m nuitka --module "$mod" --enable-plugin=anti-bloat --output-dir="$out_dir" || true
            fi
          done

      - name: Create Clean Engine Dist Folder
        shell: bash
        run: |
          python -c '
          import os, shutil, glob, sys

          target_os = "${{ matrix.os }}"
          is_win = "windows" in target_os.lower()
          is_mac = "macos" in target_os.lower()
          is_linux = "ubuntu" in target_os.lower() or "linux" in target_os.lower()

          dist_dir = "tilux_engine_dist"
          if os.path.exists(dist_dir):
              shutil.rmtree(dist_dir)
          os.makedirs(dist_dir, exist_ok=True)
          os.makedirs(os.path.join(dist_dir, "executors"), exist_ok=True)

          # 1. Copy required public runtime entrypoints (proprietary modules are compiled binaries ONLY)
          base_runtime_files = [
              "server.py", "install.py", "restart_server.py", "autostart.py", "voice.py",
              "wake_word.py", "history_manager.py", "memory.py", "tunnel_manager.py",
              "requirements.txt", "settings.json", "user_personal.json", "README.md",
              "wake_greetings.json", "voices.json"
          ]
          for f in base_runtime_files:
              if os.path.exists(f):
                  shutil.copy2(f, dist_dir)

          if os.path.exists("executors/__init__.py"):
              shutil.copy2("executors/__init__.py", os.path.join(dist_dir, "executors", "__init__.py"))

          # 2. Copy static and templates directories
          for d in ["static", "templates"]:
              if os.path.exists(d):
                  shutil.copytree(d, os.path.join(dist_dir, d), dirs_exist_ok=True)

          # 2b. Download and bundle offline Vosk wake word model (40MB) and Piper TTS voice (63MB)
          import urllib.request, zipfile
          vosk_target = os.path.join(dist_dir, "vosk-model")
          if not os.path.exists(vosk_target):
              print("[CI Dist Build] Downloading and bundling offline Vosk wake word model...")
              try:
                  urllib.request.urlretrieve("https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip", "vosk_ci.zip")
                  with zipfile.ZipFile("vosk_ci.zip", "r") as zf:
                      zf.extractall(dist_dir)
                  extracted_vosk = os.path.join(dist_dir, "vosk-model-small-en-us-0.15")
                  if os.path.exists(extracted_vosk):
                      os.rename(extracted_vosk, vosk_target)
                  if os.path.exists("vosk_ci.zip"):
                      os.remove("vosk_ci.zip")
                  print("[CI Dist Build] Vosk wake word model successfully bundled!")
              except Exception as ve:
                  print(f"[CI Dist Build] Warning: Vosk download error: {ve}")

          piper_target = os.path.join(dist_dir, "piper-model")
          os.makedirs(piper_target, exist_ok=True)
          default_onnx = os.path.join(piper_target, "en_US-lessac-medium.onnx")
          if not os.path.exists(default_onnx):
              print("[CI Dist Build] Downloading and bundling Piper TTS voice...")
              try:
                  p_url = "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
                  urllib.request.urlretrieve(p_url, default_onnx)
                  urllib.request.urlretrieve(p_url + ".json", default_onnx + ".json")
                  print("[CI Dist Build] Piper TTS voice successfully bundled!")
              except Exception as pe:
                  print(f"[CI Dist Build] Warning: Piper download error: {pe}")

          # 3. Copy OS-specific compiled binaries
          if is_win:
              bin_pattern = "*.pyd"
              exec_pattern = "executors/*.pyd"
              bin_ext = ".pyd"
          else:
              bin_pattern = "*.so"
              exec_pattern = "executors/*.so"
              bin_ext = ".so"

          for f in glob.glob(bin_pattern):
              shutil.copy2(f, dist_dir)
          for f in glob.glob(exec_pattern):
              shutil.copy2(f, os.path.join(dist_dir, "executors"))

          # Also create clean untagged aliases for universal import compatibility (e.g. brain.pyd, brain.so)
          for folder in [dist_dir, os.path.join(dist_dir, "executors")]:
              if os.path.exists(folder):
                  for f in os.listdir(folder):
                      if f.endswith(bin_ext):
                          base = f.split(".")[0]
                          clean_name = f"{base}{bin_ext}"
                          clean_path = os.path.join(folder, clean_name)
                          if not os.path.exists(clean_path):
                              try:
                                  shutil.copy2(os.path.join(folder, f), clean_path)
                              except Exception:
                                  pass

          # 4. Strict verification: ensure binary exists and no plaintext .py or .pyc remains in dist
          proprietary_modules = [
              "brain", "sfdcr", "vault", "credentials", "actions", "cloud_bridge",
              "usage_tracker", "reflex_router", "os_protocols", "os_protocol",
              "mac_permissions",
              "executors/file_executor",
              "executors/media_executor", "executors/messaging_executor"
          ]

          missing_binaries = []
          for mod in proprietary_modules:
              mod_dir = os.path.dirname(mod)
              mod_base = os.path.basename(mod)
              target_sub = os.path.join(dist_dir, mod_dir) if mod_dir else dist_dir
              has_bin = any(f.startswith(mod_base) and f.endswith(bin_ext) for f in os.listdir(target_sub)) if os.path.exists(target_sub) else False
              if not has_bin:
                  missing_binaries.append(mod)

              # Unconditionally purge any plaintext .py or .pyc files for proprietary modules
              for ext_to_purge in [".py", ".pyc"]:
                  leaked_file = os.path.join(dist_dir, f"{mod}{ext_to_purge}")
                  if os.path.exists(leaked_file):
                      os.remove(leaked_file)

          if missing_binaries:
              print(f"[CI Dist Build] Warning: The following modules did not produce a binary: {missing_binaries}")

          # Purge any leaked test files, rules or configs from the bundle
          banned_items = [
              "main.py", "make_icon.py", "parse_linkedin.py", "play_music.py",
              "database.rules.json", "firebase.json", ".env", "test_sfdcr.so",
              "firebase_sync.py", "diagnose_windows.bat", "diagnose_windows.py"
          ]
          for item in banned_items:
              target = os.path.join(dist_dir, item)
              if os.path.exists(target):
                  if os.path.isdir(target):
                      shutil.rmtree(target)
                  else:
                      os.remove(target)

          # Clean up temporary Nuitka build directories
          for b_dir in glob.glob("*.build") + glob.glob("executors/*.build"):
              if os.path.exists(b_dir):
                  shutil.rmtree(b_dir, ignore_errors=True)

          print(f"[CI Dist Build] Successfully assembled clean OS-specific distribution for {target_os}:")
          for root, dirs, files in os.walk(dist_dir):
              for file in files:
                  print("  -", os.path.relpath(os.path.join(root, file), dist_dir))
          '

      - name: Download & Bundle Standalone Python Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p tilux_engine_dist/runtime
          curl -fsSL https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip -o python_embed.zip
          unzip -q python_embed.zip -d tilux_engine_dist/runtime
          rm -f python_embed.zip

          # Enable site-packages, local imports, and executors in python311._pth
          printf "python311.zip\r\n.\r\n..\r\n..\\\\executors\r\nLib\\\\site-packages\r\nLib/site-packages\r\nimport site\r\n" > tilux_engine_dist/runtime/python311._pth

          # Install pip into embedded Python
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./tilux_engine_dist/runtime/python.exe get-pip.py --no-warn-script-location
          rm -f get-pip.py

          # Install dependencies into the embedded runtime
          ./tilux_engine_dist/runtime/python.exe -m pip install -r requirements.txt --prefer-binary --no-warn-script-location

          # Pre-bundle official cloudflared binary for instantaneous high-speed remote tunnel
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -o tilux_engine_dist/cloudflared.exe

      - name: Download & Bundle Standalone Python Runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p tilux_engine_dist/runtime
          curl -fsSL "https://github.com/astral-sh/python-build-standalone/releases/download/20240415/cpython-3.11.9+20240415-x86_64-unknown-linux-gnu-install_only.tar.gz" -o python_linux.tar.gz
          tar -xzf python_linux.tar.gz -C tilux_engine_dist/runtime --strip-components=1
          rm -f python_linux.tar.gz

          # Install dependencies into standalone runtime
          ./tilux_engine_dist/runtime/bin/python3 -m pip install -r requirements.txt --prefer-binary

          # Pre-bundle official cloudflared binary
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o tilux_engine_dist/cloudflared
          chmod +x tilux_engine_dist/cloudflared

      - name: Download & Bundle Standalone Python Runtime (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p tilux_engine_dist/runtime
          curl -fsSL "https://github.com/astral-sh/python-build-standalone/releases/download/20240415/cpython-3.11.9+20240415-aarch64-apple-darwin-install_only.tar.gz" -o python_mac.tar.gz
          tar -xzf python_mac.tar.gz -C tilux_engine_dist/runtime --strip-components=1
          rm -f python_mac.tar.gz

          # Install dependencies into standalone runtime
          ./tilux_engine_dist/runtime/bin/python3 -m pip install -r requirements.txt --prefer-binary

          # Pre-bundle official cloudflared binary
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz -o cf.tgz
          tar -xzf cf.tgz -C tilux_engine_dist
          rm -f cf.tgz
          chmod +x tilux_engine_dist/cloudflared || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Build Icons
        shell: bash
        run: |
          mkdir -p tilux-client/build
          if [ -d tilux-client/src ]; then
            cp -n tilux-client/src/icon.* tilux-client/build/ 2>/dev/null || true
          fi
          if [ -f tilux-client/build/icon.ico ]; then
            cp -n tilux-client/build/icon.ico tilux-client/build/installerIcon.ico 2>/dev/null || true
            cp -n tilux-client/build/icon.ico tilux-client/build/uninstallerIcon.ico 2>/dev/null || true
            cp -n tilux-client/build/icon.ico tilux-client/build/installerHeaderIcon.ico 2>/dev/null || true
          fi

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./tilux-client

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        working-directory: ./tilux-client

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        working-directory: ./tilux-client

      - name: Install Linux Build Dependencies (bsdtar for pacman)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux
        working-directory: ./tilux-client

      - name: Upload Final Installers
        uses: actions/upload-artifact@v4
        with:
          name: Tilux-Installers-${{ matrix.os }}
          path: ./tilux-client/dist/*.*

      - name: Publish Direct to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "Tilux ASM Official v1.0.0 Launch"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            tilux-client/dist/*.exe
            tilux-client/dist/*.dmg
            tilux-client/dist/*.deb
            tilux-client/dist/*.AppImage
            tilux-client/dist/*.rpm
            tilux-client/dist/*.pacman
            tilux-client/dist/*.zip
            tilux-client/dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

