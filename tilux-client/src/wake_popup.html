<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilux Voice</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            text-align: center;
            position: relative;
            user-select: none;
        }

        .orb-container {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
            rotate: 90deg;
            cursor: pointer;
            filter: drop-shadow(0 0 15px #c4b5fd) drop-shadow(0 0 25px #8b5cf6);
            transition: all 0.3s ease;
            margin-top: 75px; /* Increased top headroom so the ambient glow is never capped */
            flex-shrink: 0;
        }

        .orb {
            position: absolute;
            width: 130px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #060606;
            filter: blur(18px);
            transition: all 0.3s ease;
        }

        .orb-container:hover .orb {
            width: 150px;
            animation: rotate 6s infinite;
        }

        .orb-inner {
            position: absolute;
            left: -120%;
            top: -25%;
            width: 160%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #c4b5fd;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 91%, 50% 70%, 21% 91%, 32% 57%,
                2% 35%, 39% 35%
            );
            animation: rotate 6s linear infinite;
            transition: all 0.3s ease;
        }

        .orb-inner:nth-child(2) {
            left: auto;
            right: -120%;
            top: auto;
            bottom: -25%;
            background: #8b5cf6;
            animation-duration: 8s;
            clip-path: polygon(
                20% 0%, 0% 20%, 30% 50%, 0% 80%,
                20% 100%, 50% 70%, 80% 100%, 100% 80%,
                70% 50%, 100% 20%, 80% 0%, 50% 30%
            );
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .orb-container:hover .orb .orb-inner {
            width: 170%;
        }

        .text-container {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin-top: 6px;
        }

        #main-text {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            max-height: 80px;
            overflow-y: auto;
            opacity: 0.95;
            margin-bottom: 4px;
            min-height: 32px;
            scrollbar-width: none;
            padding: 0 6px;
            box-sizing: border-box;
            transition: all 0.12s ease;
        }

        #main-text::-webkit-scrollbar {
            display: none;
        }

        #sub-text {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
            color: #d1d5db;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.9;
            min-height: 18px;
            padding: 0 4px;
            transition: color 0.15s ease;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px 0 5px 0;
            max-width: 96%;
            transition: all 0.2s ease;
        }

        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 12px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 500;
            font-family: 'Outfit', monospace;
            backdrop-filter: blur(12px);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .action-badge.thinking {
            background: rgba(139, 92, 246, 0.16);
            border: 1px solid rgba(192, 132, 252, 0.45);
            color: #d8b4fe;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
            animation: pulse-glow 1.5s infinite alternate ease-in-out;
        }

        .action-badge.command {
            background: rgba(14, 165, 233, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.55);
            color: #38bdf8;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
            animation: pulse-glow 1.0s infinite alternate ease-in-out;
        }

        .action-badge.success {
            background: rgba(16, 185, 129, 0.16);
            border: 1px solid rgba(52, 211, 153, 0.45);
            color: #34d399;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
        }

        .action-badge.speaking {
            background: rgba(192, 132, 252, 0.16);
            border: 1px solid rgba(192, 132, 252, 0.45);
            color: #f3e8ff;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.85; transform: scale(0.99); }
            100% { opacity: 1; transform: scale(1.01); }
        }
    </style>
</head>
<body>
    <div class="orb-container">
        <div class="orb" id="orb">
            <div class="orb-inner"></div>
            <div class="orb-inner"></div>
        </div>
    </div>
    
    <div class="text-container">
        <div id="main-text"></div>
        <div id="badge-container" class="badge-container" style="display: none;">
            <div id="action-badge" class="action-badge">
                <span id="badge-icon" class="badge-icon">⚡</span>
                <span id="badge-text" class="badge-text"></span>
            </div>
        </div>
        <div id="sub-text"></div>
    </div>
    
    <script>
        let isDismissed = false;
        let fullMainText = "";
        let lastSpokenId = null;
        let voices = [];
        let hasSpeech = ('speechSynthesis' in window);

        function dismissWidget(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (isDismissed) return;
            isDismissed = true;

            if (hasSpeech) {
                try {
                    window.speechSynthesis.cancel();
                } catch(err) {}
            }

            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('http://127.0.0.1:8932/api/widget_dismiss');
                }
            } catch(err) {}

            try {
                fetch('http://127.0.0.1:8932/api/widget_dismiss', { method: 'POST', keepalive: true }).catch(() => {});
                fetch('http://127.0.0.1:8932/api/stop', { method: 'POST', keepalive: true }).catch(() => {});
            } catch(err) {}

            setTimeout(() => {
                window.close();
            }, 30);
        }

        document.body.addEventListener('click', (e) => {
            dismissWidget(e);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') dismissWidget(e);
        });

        function refreshVoices() {
            if (!hasSpeech) return;
            try {
                voices = window.speechSynthesis.getVoices() || [];
                if (voices.length > 0) {
                    reportCapabilities(true);
                }
            } catch(e) {}
        }

        async function reportCapabilities(canSpeak) {
            try {
                await fetch('http://127.0.0.1:8932/api/widget_capabilities', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ browser_tts: canSpeak && voices.length > 0 })
                });
            } catch(e) {}
        }

        if (hasSpeech) {
            refreshVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = refreshVoices;
            }
            setTimeout(refreshVoices, 300);
        } else {
            reportCapabilities(false);
        }

        function cleanSpokenText(text) {
            if (!text) return "";
            return text
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\[(.*?)\]\(.*?\)/g, '$1')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/https?:\/\/[^\s]+/g, '')
                .replace(/[*_~`#>\-]/g, '')
                .trim();
        }

        function speakWithBrowserSync(rawText, speakId) {
            if (speakId === lastSpokenId || !rawText) return;
            lastSpokenId = speakId;

            const cleanText = cleanSpokenText(rawText);
            const orb = document.getElementById('orb');

            if (!cleanText) return;

            if (!hasSpeech || voices.length === 0) {
                if (orb) orb.style.animationDuration = "0.7s";
                setTimeout(() => {
                    if (orb) orb.style.animationDuration = "2s";
                    fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
                }, Math.min(5000, Math.max(1500, cleanText.split(' ').length * 280)));
                return;
            }

            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.resume();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.05;

                const chosenVoice = voices.find(v => 
                    v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Jenny') || v.name.includes('Guy'))
                ) || voices.find(v => v.lang.startsWith('en')) || voices[0];

                if (chosenVoice) utterance.voice = chosenVoice;

                utterance.onstart = () => {
                    if (orb) orb.style.animationDuration = "0.7s";
                };

                utterance.onend = () => {
                    if (orb) orb.style.animationDuration = "2s";
                    fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
                };

                utterance.onerror = () => {
                    if (orb) orb.style.animationDuration = "2s";
                    fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
                };

                window.speechSynthesis.speak(utterance);
            } catch(e) {
                if (orb) orb.style.animationDuration = "2s";
                fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
            }
        }

        let emptyStateCount = 0;

        async function updateState() {
            if (isDismissed) return;
            try {
                const res = await fetch('http://127.0.0.1:8932/api/widget_state');
                const data = await res.json();
                const mainEl = document.getElementById('main-text');

                if (!data.main_text && !data.sub_text && !data.is_speaking) {
                    emptyStateCount++;
                    if (emptyStateCount > 35) {
                        dismissWidget();
                        return;
                    }
                } else {
                    emptyStateCount = 0;
                }

                // 1. If server sent speech request with speak_id
                if (data.speak_text && data.speak_id && data.speak_id !== lastSpokenId) {
                    speakWithBrowserSync(data.speak_text, data.speak_id);
                } else if (data.reply_text && data.speak_id && data.speak_id !== lastSpokenId) {
                    lastSpokenId = data.speak_id;
                    const orb = document.getElementById('orb');
                    if (orb) orb.style.animationDuration = "0.7s";
                    setTimeout(() => {
                        if (orb) orb.style.animationDuration = "2s";
                    }, 2500);
                }

                const badgeContainer = document.getElementById('badge-container');
                const badgeEl = document.getElementById('action-badge');
                const badgeIcon = document.getElementById('badge-icon');
                const badgeText = document.getElementById('badge-text');

                // Determine active badge state based on live server data
                const cmd = (data.command_text || "").trim();
                const th = (data.thought_text || "").trim();
                const sub = (data.sub_text || "").trim();
                const sLower = sub.toLowerCase();

                // 2. Text & Badge rendering:
                if (data.is_speaking || data.main_text === "Speaking...") {
                    if (badgeContainer) badgeContainer.style.display = "none";
                    if (mainEl && mainEl.innerText !== "Speaking...") {
                        mainEl.innerText = "Speaking...";
                    }
                    if (subEl) {
                        subEl.innerText = data.reply_text || data.sub_text || "";
                        subEl.style.color = "#c084fc";
                    }
                } else if (data.main_text === "Listening..." || data.main_text === "I'm listening...") {
                    if (badgeContainer) badgeContainer.style.display = "none";
                    if (mainEl && mainEl.innerText !== data.main_text) {
                        mainEl.innerText = data.main_text;
                    }
                    if (subEl) {
                        subEl.innerText = "";
                    }
                } else {
                    // Processing / Thinking / Running Command
                    if (mainEl && data.main_text && data.main_text !== fullMainText) {
                        fullMainText = data.main_text;
                        mainEl.innerText = fullMainText;
                    }

                    // Dynamic Live Badge Update: shows real reason and executed commands
                    if (badgeContainer && badgeEl && badgeIcon && badgeText) {
                        if (sLower.startsWith("running:") || sLower.startsWith("bash:") || sLower.startsWith("automating")) {
                            badgeContainer.style.display = "flex";
                            badgeEl.className = "action-badge command";
                            badgeIcon.innerText = "⚡";
                            const cleanCmd = sub.replace(/^running:\s*/i, '').replace(/^bash:\s*/i, '');
                            badgeText.innerText = cleanCmd || cmd || "Executing command...";
                            if (subEl) {
                                subEl.innerText = "Executing action on desktop...";
                                subEl.style.color = "#38bdf8";
                            }
                        } else if (sLower.startsWith("ran:") || sLower.startsWith("done:") || sLower.includes("completed")) {
                            badgeContainer.style.display = "flex";
                            badgeEl.className = "action-badge success";
                            badgeIcon.innerText = "✓";
                            badgeText.innerText = sub;
                            if (subEl) {
                                subEl.innerText = "Command finished, preparing reply...";
                                subEl.style.color = "#34d399";
                            }
                        } else if (sLower.startsWith("planning:")) {
                            badgeContainer.style.display = "flex";
                            badgeEl.className = "action-badge command";
                            badgeIcon.innerText = "⚙️";
                            badgeText.innerText = sub;
                            if (subEl) {
                                subEl.innerText = "Planning automated action...";
                                subEl.style.color = "#38bdf8";
                            }
                        } else if (sLower.startsWith("thinking:") || th || sLower.includes("analyzing")) {
                            badgeContainer.style.display = "flex";
                            badgeEl.className = "action-badge thinking";
                            badgeIcon.innerText = "🧠";
                            const thinkContent = sub.replace(/^thinking:\s*/i, '') || th || "Formulating plan...";
                            badgeText.innerText = thinkContent;
                            if (subEl) {
                                subEl.innerText = thinkContent;
                                subEl.style.color = "#c084fc";
                            }
                        } else if (sub) {
                            badgeContainer.style.display = "flex";
                            badgeEl.className = "action-badge thinking";
                            badgeIcon.innerText = "⚡";
                            badgeText.innerText = sub;
                            if (subEl) {
                                subEl.innerText = sub;
                                subEl.style.color = "#d1d5db";
                            }
                        } else {
                            badgeContainer.style.display = "none";
                            if (subEl) subEl.innerText = "";
                        }
                    }
                }

                const orb = document.getElementById('orb');
                if (orb) {
                    if (data.is_speaking || data.main_text === "Speaking...") {
                        orb.style.animationDuration = "0.7s";
                    } else if (data.main_text === "Listening..." || data.main_text === "I'm listening...") {
                        orb.style.animationDuration = "1.8s";
                    } else if (data.main_text === "Transcribing..." || (data.sub_text && (data.sub_text.includes("Thinking") || data.sub_text.includes("Bash:") || data.sub_text.includes("Executing")))) {
                        orb.style.animationDuration = "0.4s";
                    } else {
                        orb.style.animationDuration = "2.2s";
                    }
                }
            } catch(e) {}
        }

        setInterval(updateState, 100);
        updateState();
    </script>
</body>
</html>
