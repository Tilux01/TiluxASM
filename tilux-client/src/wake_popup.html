<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilux Listening...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            text-align: center;
        }

        .orb-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
            rotate: 90deg;
            cursor: pointer;
            filter: drop-shadow(0 0 15px #c4b5fd) drop-shadow(0 0 25px #8b5cf6);
            transition: all 0.3s ease;
            margin-top: 35px;
            flex-shrink: 0;
        }

        .orb {
            position: absolute;
            width: 140px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #060606;
            filter: blur(18px);
            transition: all 0.3s ease;
        }

        .orb-container:hover .orb {
            width: 160px;
            animation: rotate 6s infinite;
        }

        .orb-inner {
            position: absolute;
            left: -120%;
            top: -25%;
            width: 160%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #c4b5fd;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 91%, 50% 70%, 21% 91%, 32% 57%,
                2% 35%, 39% 35%
            );
            animation: rotate 6s linear infinite;
            transition: all 0.3s ease;
        }

        .orb-inner:nth-child(2) {
            left: auto;
            right: -120%;
            top: auto;
            bottom: -25%;
            background: #8b5cf6;
            animation-duration: 8s;
            clip-path: polygon(
                20% 0%, 0% 20%, 30% 50%, 0% 80%,
                20% 100%, 50% 70%, 80% 100%, 100% 80%,
                70% 50%, 100% 20%, 80% 0%, 50% 30%
            );
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .orb-container:hover .orb .orb-inner {
            width: 170%;
        }

        .text-container {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin-top: 5px;
        }

        #main-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.95;
            margin-bottom: 5px;
            min-height: 20px;
        }

        #sub-text {
            font-size: 14px;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.3px;
            color: #d1d5db;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.8;
            min-height: 15px;
        }
    </style>
</head>
<body>
    <div class="orb-container">
        <div class="orb" id="orb">
            <div class="orb-inner"></div>
            <div class="orb-inner"></div>
        </div>
    </div>
    
    <div class="text-container">
        <div id="main-text"></div>
        <div id="sub-text"></div>
    </div>
    
    <script>
        document.body.addEventListener('click', () => {
            window.blur(); 
        });
        
        let fullMainText = "";
        let chunks = [];
        let currentChunkIndex = 0;
        let chunkTimer = null;

        function splitIntoChunks(text, wordsPerChunk) {
            let words = text.split(" ");
            let result = [];
            for (let i = 0; i < words.length; i += wordsPerChunk) {
                result.push(words.slice(i, i + wordsPerChunk).join(" "));
            }
            return result;
        }

        async function updateState() {
            try {
                const res = await fetch('http://127.0.0.1:8932/api/widget_state');
                const data = await res.json();
                
                if (data.main_text !== fullMainText) {
                    fullMainText = data.main_text;
                    clearTimeout(chunkTimer);
                    
                    if (fullMainText === "Listening..." || fullMainText.length < 35) {
                        document.getElementById('main-text').innerText = fullMainText;
                    } else {
                        // Subtitle mode
                        chunks = splitIntoChunks(fullMainText, 6);
                        currentChunkIndex = 0;
                        
                        function nextChunk() {
                            if (currentChunkIndex < chunks.length) {
                                document.getElementById('main-text').innerText = chunks[currentChunkIndex];
                                let durationMs = Math.max(1000, chunks[currentChunkIndex].length * 65); 
                                currentChunkIndex++;
                                chunkTimer = setTimeout(nextChunk, durationMs);
                            } else {
                                document.getElementById('main-text').innerText = chunks[chunks.length - 1] || "";
                            }
                        }
                        nextChunk();
                    }
                }
                
                let sub = data.sub_text;
                if (sub.toLowerCase().includes("ran a command") || sub.includes("Running:") || sub.includes("Tool:")) {
                    sub = "Working on it...";
                }
                document.getElementById('sub-text').innerText = sub;
                
                const orb = document.getElementById('orb');
                if (data.main_text === "Listening...") {
                    orb.style.animationDuration = "1.5s";
                } else if (data.sub_text) {
                    orb.style.animationDuration = "0.7s";
                } else {
                    orb.style.animationDuration = "2s";
                }
            } catch(e) {}
        }
        
        setInterval(updateState, 500);
        updateState();
    </script>
</body>
</html>
