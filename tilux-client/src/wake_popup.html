<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilux Voice</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: visible;
            background: transparent !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            text-align: center;
            position: relative;
        }

        /* Ethereal Glowing Orbit - Plenty of padding so drop-shadow never clips at borders */
        .orb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .orb-wrapper:hover {
            transform: scale(1.05);
        }

        .orb-container {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            rotate: 90deg;
            /* Multi-layer ambient aura with zero flat edge capping */
            filter: drop-shadow(0 0 16px rgba(196, 181, 253, 0.85)) drop-shadow(0 0 32px rgba(139, 92, 246, 0.7)) drop-shadow(0 0 48px rgba(124, 58, 237, 0.45));
            transition: filter 0.3s ease;
            flex-shrink: 0;
        }

        .orb {
            position: absolute;
            width: 130px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #060606;
            filter: blur(18px);
            transition: all 0.3s ease;
        }

        .orb-inner {
            position: absolute;
            left: -120%;
            top: -25%;
            width: 160%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #c4b5fd;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 91%, 50% 70%, 21% 91%, 32% 57%,
                2% 35%, 39% 35%
            );
            animation: rotate 6s linear infinite;
            transition: all 0.3s ease;
        }

        .orb-inner:nth-child(2) {
            left: auto;
            right: -120%;
            top: auto;
            bottom: -25%;
            background: #8b5cf6;
            animation-duration: 8s;
            clip-path: polygon(
                20% 0%, 0% 20%, 30% 50%, 0% 80%,
                20% 100%, 50% 70%, 80% 100%, 100% 80%,
                70% 50%, 100% 20%, 80% 0%, 50% 30%
            );
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Subtle, Minimalist Status Pill (No broken text streaming) */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 14px;
            border-radius: 20px;
            margin-top: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a855f7;
            box-shadow: 0 0 8px #a855f7;
            animation: pulseDot 1.4s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 12px #c084fc; }
        }

        #status-label {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="orb-wrapper" onclick="dismissWidget(event)" title="Click to dismiss">
        <div class="orb-container">
            <div class="orb" id="orb">
                <div class="orb-inner"></div>
                <div class="orb-inner"></div>
            </div>
        </div>
        
        <div class="status-pill" id="status-pill">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-label">Listening...</span>
        </div>
    </div>

    <script>
        let isDismissed = false;
        let lastSpokenId = null;
        let voices = [];
        let hasSpeech = ('speechSynthesis' in window);

        function dismissWidget(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (isDismissed) return;
            isDismissed = true;

            if (hasSpeech) {
                try {
                    window.speechSynthesis.cancel();
                } catch(err) {}
            }

            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('http://127.0.0.1:8932/api/stop');
                }
            } catch(err) {}

            try {
                fetch('http://127.0.0.1:8932/api/stop', { method: 'POST', keepalive: true }).catch(() => {});
            } catch(err) {}

            setTimeout(() => {
                window.close();
            }, 30);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') dismissWidget(e);
        });

        function refreshVoices() {
            if (!hasSpeech) return;
            try {
                voices = window.speechSynthesis.getVoices() || [];
                if (voices.length > 0) {
                    reportCapabilities(true);
                }
            } catch(e) {}
        }

        async function reportCapabilities(canSpeak) {
            try {
                await fetch('http://127.0.0.1:8932/api/widget_capabilities', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ browser_tts: canSpeak && voices.length > 0 })
                });
            } catch(e) {}
        }

        if (hasSpeech) {
            refreshVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = refreshVoices;
            }
            setTimeout(refreshVoices, 300);
        } else {
            reportCapabilities(false);
        }

        function cleanSpokenText(text) {
            if (!text) return "";
            return text
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\[(.*?)\]\(.*?\)/g, '$1')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/https?:\/\/[^\s]+/g, '')
                .replace(/[*_~`#>\-]/g, '')
                .trim();
        }

        function speakWithBrowserSync(rawText, speakId) {
            if (speakId === lastSpokenId || !rawText) return;
            lastSpokenId = speakId;

            const cleanText = cleanSpokenText(rawText);
            const orb = document.getElementById('orb');
            const statusLabel = document.getElementById('status-label');

            if (!cleanText) return;

            if (statusLabel) statusLabel.innerText = "Speaking...";

            if (!hasSpeech || voices.length === 0) {
                if (orb) orb.style.animationDuration = "0.7s";
                return;
            }

            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.resume();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                // Snappy, natural conversational tempo (Gemini Live style)
                utterance.rate = 1.15;

                const chosenVoice = voices.find(v => 
                    v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Jenny') || v.name.includes('Guy'))
                ) || voices.find(v => v.lang.startsWith('en')) || voices[0];

                if (chosenVoice) utterance.voice = chosenVoice;

                utterance.onstart = () => {
                    if (orb) orb.style.animationDuration = "0.6s";
                    if (statusLabel) statusLabel.innerText = "Speaking...";
                };

                utterance.onend = () => {
                    if (orb) orb.style.animationDuration = "2.5s";
                    if (statusLabel) statusLabel.innerText = "Ready";
                    fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
                };

                utterance.onerror = () => {
                    if (orb) orb.style.animationDuration = "2.5s";
                    if (statusLabel) statusLabel.innerText = "Ready";
                    fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
                };

                window.speechSynthesis.speak(utterance);
            } catch(e) {
                if (orb) orb.style.animationDuration = "2.5s";
                fetch('http://127.0.0.1:8932/api/widget_speech_done', { method: 'POST' }).catch(() => {});
            }
        }

        async function updateState() {
            if (isDismissed) return;
            try {
                const res = await fetch('http://127.0.0.1:8932/api/widget_state');
                const data = await res.json();
                const statusLabel = document.getElementById('status-label');
                const orb = document.getElementById('orb');

                if (data.speak_text && data.speak_id && data.speak_id !== lastSpokenId) {
                    speakWithBrowserSync(data.speak_text, data.speak_id);
                } else if (data.reply_text && data.speak_id && data.speak_id !== lastSpokenId) {
                    lastSpokenId = data.speak_id;
                    if (statusLabel) statusLabel.innerText = "Speaking...";
                    if (orb) orb.style.animationDuration = "0.6s";
                }

                if (statusLabel && !data.is_speaking) {
                    if (data.main_text === "Listening...") {
                        statusLabel.innerText = "Listening...";
                    } else if (data.main_text === "Processing..." || data.sub_text === "Thinking...") {
                        statusLabel.innerText = "Thinking...";
                    } else if (data.sub_text) {
                        statusLabel.innerText = data.sub_text;
                    }
                }

                if (orb) {
                    if (data.main_text === "Listening...") {
                        orb.style.animationDuration = "1.2s";
                    } else if (data.main_text === "Processing..." || data.sub_text === "Thinking...") {
                        orb.style.animationDuration = "0.4s";
                    } else if (data.is_speaking) {
                        orb.style.animationDuration = "0.6s";
                    } else {
                        orb.style.animationDuration = "2.5s";
                    }
                }
            } catch(e) {}
        }

        // Fast 50ms reactive state polling
        setInterval(updateState, 50);
        updateState();
    </script>
</body>
</html>
