<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilux Voice</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            text-align: center;
            position: relative;
            user-select: none;
        }

        .orb-container {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
            rotate: 90deg;
            cursor: pointer;
            filter: drop-shadow(0 0 15px #c4b5fd) drop-shadow(0 0 25px #8b5cf6);
            transition: all 0.3s ease;
            margin-top: 75px; /* Increased top headroom so the ambient glow is never capped */
            flex-shrink: 0;
        }

        .orb {
            position: absolute;
            width: 130px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #060606;
            filter: blur(18px);
            transition: all 0.3s ease;
        }

        .orb-container:hover .orb {
            width: 150px;
            animation: rotate 6s infinite;
        }

        .orb-inner {
            position: absolute;
            left: -120%;
            top: -25%;
            width: 160%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #c4b5fd;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 91%, 50% 70%, 21% 91%, 32% 57%,
                2% 35%, 39% 35%
            );
            animation: rotate 6s linear infinite;
            transition: all 0.3s ease;
        }

        .orb-inner:nth-child(2) {
            left: auto;
            right: -120%;
            top: auto;
            bottom: -25%;
            background: #8b5cf6;
            animation-duration: 8s;
            clip-path: polygon(
                20% 0%, 0% 20%, 30% 50%, 0% 80%,
                20% 100%, 50% 70%, 80% 100%, 100% 80%,
                70% 50%, 100% 20%, 80% 0%, 50% 30%
            );
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .orb-container:hover .orb .orb-inner {
            width: 170%;
        }

        .text-container {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin-top: 6px;
        }

        #main-text {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            max-height: 80px;
            overflow-y: auto;
            opacity: 0.95;
            margin-bottom: 4px;
            min-height: 32px;
            scrollbar-width: none;
            padding: 0 6px;
            box-sizing: border-box;
            transition: all 0.12s ease;
        }

        #main-text::-webkit-scrollbar {
            display: none;
        }

        #sub-text {
            font-size: 13px;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.2px;
            color: #9ca3af;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.95;
            min-height: 18px;
            padding: 0 4px;
            margin-top: 2px;
            transition: color 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="orb-container">
        <div class="orb" id="orb">
            <div class="orb-inner"></div>
            <div class="orb-inner"></div>
        </div>
    </div>
    
    <div class="text-container">
        <div id="main-text"></div>
        <div id="sub-text"></div>
    </div>
    
    <script>
        let isDismissed = false;
        let fullMainText = "";
        let emptyStateCount = 0;

        function dismissWidget(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (isDismissed) return;
            isDismissed = true;

            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('http://127.0.0.1:8932/api/widget_dismiss');
                }
            } catch(err) {}

            try {
                fetch('http://127.0.0.1:8932/api/widget_dismiss', { method: 'POST', keepalive: true }).catch(() => {});
                fetch('http://127.0.0.1:8932/api/stop', { method: 'POST', keepalive: true }).catch(() => {});
            } catch(err) {}

            setTimeout(() => {
                window.close();
            }, 30);
        }

        document.body.addEventListener('click', (e) => {
            dismissWidget(e);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') dismissWidget(e);
        });

        async function updateState() {
            if (isDismissed) return;
            try {
                const res = await fetch('http://127.0.0.1:8932/api/widget_state');
                const data = await res.json();
                const mainEl = document.getElementById('main-text');
                const subEl = document.getElementById('sub-text');

                if (!data.main_text && !data.sub_text && !data.is_speaking) {
                    emptyStateCount++;
                    if (emptyStateCount > 35) {
                        dismissWidget();
                        return;
                    }
                } else {
                    emptyStateCount = 0;
                }

                // 1. Text rendering & Speaking synchronization
                if (data.is_speaking || data.main_text === "Speaking...") {
                    if (mainEl && mainEl.innerText !== "Speaking...") {
                        mainEl.innerText = "Speaking...";
                    }
                    if (subEl) {
                        subEl.innerText = data.reply_text || data.sub_text || "";
                        subEl.style.color = "#c084fc";
                    }
                }
 else if (data.main_text === "Listening..." || data.main_text === "I'm listening...") {
                    if (mainEl && mainEl.innerText !== data.main_text) {
                        mainEl.innerText = data.main_text;
                    }
                    if (subEl) {
                        subEl.innerText = "";
                    }
                } else {
                    // Processing / Thinking / Running Command
                    if (mainEl && data.main_text && data.main_text !== fullMainText) {
                        fullMainText = data.main_text;
                        mainEl.innerText = fullMainText;
                    }

                    if (subEl) {
                        const sub = (data.sub_text || "").trim();
                        const th = (data.thought_text || "").trim();
                        const cmd = (data.command_text || "").trim();
                        const mainLower = (data.main_text || "").trim().toLowerCase();

                        // Clean process status: NEVER echo rules, restrictions, or user's question
                        function sanitizeProcess(text) {
                            if (!text) return "";
                            let t = text.trim();
                            const tLower = t.toLowerCase();

                            // Filter out any meta rule / policy / instruction references
                            if (/\b(?:rule|rules|instruction|prompt|guardrail|policy|guideline|reveal|forbidden|disclose|architecture|mechanic|deepseek|gemini|openai|claude|llm|token)\b/i.test(tLower)) {
                                return "Thinking...";
                            }

                            if (tLower.startsWith("analyzing")) return "Thinking...";
                            if (t.startsWith("Running: ") || t.startsWith("Ran: ")) return "Executing action...";

                            // Check if text echoes the user's question or command
                            if (mainLower) {
                                const cleanMain = mainLower.replace(/[^a-z0-9\s]/g, '').trim();
                                const cleanT = t.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
                                if (cleanMain.length > 2 && (cleanT.includes(cleanMain) || cleanMain.includes(cleanT))) {
                                    return "Thinking...";
                                }
                                const words = cleanMain.split(/\s+/).filter(w => w.length > 3);
                                let overlap = 0;
                                for (const w of words) {
                                    if (cleanT.includes(w)) overlap++;
                                }
                                if (words.length > 0 && overlap >= Math.min(2, words.length)) {
                                    return "Thinking...";
                                }
                            }
                            return t;
                        }

                        let processText = "Thinking...";
                        if (cmd) {
                            processText = "Executing action...";
                        } else if (sub && sub !== "Thinking...") {
                            const cleanSub = sanitizeProcess(sub);
                            processText = cleanSub || "Thinking...";
                        } else if (th) {
                            const cleanTh = sanitizeProcess(th);
                            processText = cleanTh ? `Thinking: ${cleanTh}` : "Thinking...";
                        }

                        subEl.innerText = processText;
                        subEl.style.color = "#9ca3af";
                    }
                }

                const orb = document.getElementById('orb');
                if (orb) {
                    if (data.is_speaking || data.main_text === "Speaking...") {
                        orb.style.animationDuration = "0.7s";
                    } else if (data.main_text === "Listening..." || data.main_text === "I'm listening...") {
                        orb.style.animationDuration = "1.8s";
                    } else if (data.main_text === "Transcribing..." || (data.sub_text && (data.sub_text.includes("Thinking") || data.sub_text.includes("Bash:") || data.sub_text.includes("Executing")))) {
                        orb.style.animationDuration = "0.4s";
                    } else {
                        orb.style.animationDuration = "2.2s";
                    }
                }
            } catch(e) {}
        }

        setInterval(updateState, 100);
        updateState();
    </script>
</body>
</html>
